#####################################################################
#   Hotend fan rotor-lock alarm - HoneyBadger P-series 4010A-24V-9400
#####################################################################
# The fan's yellow RD wire is an open-collector alarm output (not a tach):
#   fan running      -> RD pulled LOW by the fan     -> button RELEASED
#   rotor locked     -> RD released, pulled HIGH     -> button PRESSED
#   fan switched off -> fan GND is open (low-side MOSFET), RD floats HIGH -> PRESSED,
#                       so the alarm is only evaluated while the hotend fan is commanded on.
# Wiring: yellow -> FLY-SB2040 v1 LIMIT_1 signal (gpio29), internal pull-up (^).
#
# Watchdog: every 3 s, if the hotend fan is on, the hotend is above check_temp and the alarm is
# active for max_failures checks in a row (~12 s, covers fan spin-up), the print is paused and the
# hotend heater is turned off. A stalled hotend fan causes heat creep and clogs (see clog history).

[gcode_button hotend_fan_alarm]
pin: ^SB2040:gpio29
press_gcode:
    {% if printer['heater_fan hotend_fan'].speed > 0 %}
        RESPOND TYPE=echo MSG="Hotend fan RD alarm active (rotor locked?)"
    {% endif %}
release_gcode:

[gcode_macro _HOTEND_FAN_WATCHDOG]
variable_check_temp: 60         # Only check when the hotend is hotter than this
variable_max_failures: 4        # 4 x 3 s = ~12 s
variable_failures: 0
gcode:
    {% set fan_on = printer['heater_fan hotend_fan'].speed > 0 %}
    {% set alarm = printer['gcode_button hotend_fan_alarm'].state == "PRESSED" %}
    {% set temp = printer.extruder.temperature %}
    {% if fan_on and alarm and temp > check_temp %}
        {% set count = failures + 1 %}
        SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_WATCHDOG VARIABLE=failures VALUE={count}
        {% if count >= max_failures %}
            RESPOND TYPE=error MSG="Hotend fan failure (rotor-lock alarm) at {temp|int}C. Pausing and turning off the hotend heater."
            {% if printer.print_stats.state == "printing" %}
                PAUSE
            {% endif %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
            SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_WATCHDOG VARIABLE=failures VALUE=0
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_WATCHDOG VARIABLE=failures VALUE=0
    {% endif %}

[delayed_gcode _HOTEND_FAN_WATCHDOG_TIMER]
initial_duration: 10
gcode:
    _HOTEND_FAN_WATCHDOG
    UPDATE_DELAYED_GCODE ID=_HOTEND_FAN_WATCHDOG_TIMER DURATION=3
