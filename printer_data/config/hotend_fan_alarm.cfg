#####################################################################
#   Hotend fan watchdog - HoneyBadger 4010A-24-9400 "High SP & Tach"
#####################################################################
# Tach (white wire) -> FLY-SB2040 v1 LIMIT_1 signal (gpio29), configured in printer.cfg
# [heater_fan hotend_fan] (tachometer_pin / tachometer_ppr).
#
# Every 3 s: if the hotend fan is commanded on, the hotend is above check_temp and the fan
# reports less than min_rpm for max_failures checks in a row (~12 s, covers spin-up), the print
# is paused and the hotend heater is turned off. A stalled hotend fan causes heat creep and clogs.
# Does nothing if no tachometer is configured (rpm is None).

[gcode_macro _HOTEND_FAN_WATCHDOG]
variable_min_rpm: 3000          # 9400 RPM nominal; alarm well below that
variable_check_temp: 60         # Only check when the hotend is hotter than this
variable_max_failures: 4        # 4 x 3 s = ~12 s
variable_failures: 0
gcode:
    {% set fan = printer['heater_fan hotend_fan'] %}
    {% set temp = printer.extruder.temperature %}
    {% if fan.rpm is not none and fan.speed > 0 and temp > check_temp and fan.rpm < min_rpm %}
        {% set count = failures + 1 %}
        SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_WATCHDOG VARIABLE=failures VALUE={count}
        {% if count >= max_failures %}
            RESPOND TYPE=error MSG="Hotend fan failure: {fan.rpm|int} RPM at {temp|int}C. Pausing and turning off the hotend heater."
            {% if printer.print_stats.state == "printing" %}
                PAUSE
            {% endif %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
            SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_WATCHDOG VARIABLE=failures VALUE=0
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_WATCHDOG VARIABLE=failures VALUE=0
    {% endif %}

[delayed_gcode _HOTEND_FAN_WATCHDOG_TIMER]
initial_duration: 10
gcode:
    _HOTEND_FAN_WATCHDOG
    UPDATE_DELAYED_GCODE ID=_HOTEND_FAN_WATCHDOG_TIMER DURATION=3
