# =====================================================================
#  chamber_heater.cfg - 500 W PTC chamber heater (230 V via SSR)
# =====================================================================
#  STATUS: DRAFT, NOT INCLUDED. Written 2026-11-24, heater not fitted yet.
#
#  Hardware (see config_backup README "Chamber heater"):
#    Heater  PTCYIDU JQ-96A2-220V-500W-CK, 230 V 500 W (inrush ~4 A),
#            built-in auto-reset bimetal 150 C / 130 C.
#            Fins ~230 C with NO airflow -> the fan interlock matters.
#    Mains   L -> thermal fuse SANTE 10A 172 C (C496729, clamped on the
#            aluminium) -> SSR load side -> heater -> N.
#            Aluminium bonded to PE by our own clamp (insulation only
#            400 V withstand, not trusted). 30 mA RCD on the circuit.
#    SSR     2nd SSR (DC control 3-32 V, >= 10 A, zero-cross), control
#            side on Spider E1-OUT (PC8): SSR+ -> E1 +24 V, SSR- -> E1 -
#            (same scheme as the bed SSR on BED-OUT).
#    Fan     24 V fan through the heater (4-wire with tach), power on
#            Spider FAN1 (PB1, free since the part fan moved to the
#            SB2040; check the FAN1 voltage jumper = 24 V).
#            Tach (white/yellow) -> Spider endstop PA1 signal pin (free
#            since the probe moved to the SB2040), GND to the same header.
#    Sensor  control sensor = chamber air NTC on PC0 (today
#            "temperature_sensor chamber_air" in chamber_sensors.cfg).
#
#  Safety layers (independent of each other):
#    1. Klipper: max_temp, verify_heater (heater must make progress)
#    2. Klipper: _CHAMBER_FAN_GUARD - heater off + pause if the fan tach
#       reads < 1000 rpm while the heater has a target
#    3. Klipper: chamber_top (PC2) max_temp 90 -> MCU shutdown (sensor
#       out of range also cuts the SSR, because shutdown turns all
#       heaters off)
#    4. Heater: built-in bimetal 150 C (auto-reset)
#    5. Thermal fuse 172 C (one-shot) - only if the bimetal welds shut
#
#  Limits: the USB camera is rated 70 C max, motors/belts/rail grease
#  ~80 C. Keep targets <= 65 C until the camera is moved or replaced.
#
#  How to activate (on site, after the hardware is installed + tested):
#    1. chamber_sensors.cfg: comment out [temperature_sensor chamber_air]
#       (PC0 moves to the heater below) and set chamber_top max_temp: 90
#    2. heatsoak.cfg: variable_sensor: "heater_generic chamber_heater"
#    3. printer.cfg: [include chamber_heater.cfg]
#    4. FIRMWARE_RESTART, check the fan spins and rpm reads, then
#       CHAMBER_HEAT TARGET=40 with someone watching, measure the fin
#       temperature with an IR thermometer, then raise step by step.
# =====================================================================

[heater_generic chamber_heater]
# Not called "chamber": [temperature_sensor chamber] (SB2040 gpio26) exists.
gcode_id: CH
heater_pin: PC8                 # Spider E1-OUT -> SSR control input
max_power: 1.0
sensor_type: Generic 3950
sensor_pin: PC0                 # Spider T0, chamber air (was chamber_air)
control: watermark              # PTC + SSR: simple on/off is fine
max_delta: 1.0
min_temp: 0
max_temp: 75                    # Klipper shutdown above this (target max 65)

[verify_heater chamber_heater]
# A chamber heats slowly: allow 10 min to gain 2 C, then stay within 5 C.
max_error: 300
check_gain_time: 600
hysteresis: 5
heating_gain: 2

[heater_fan chamber_heater_fan]
pin: PB1                        # Spider FAN1
heater: chamber_heater
heater_temp: 45                 # keeps running (cooling the fins) until the chamber is below 45 C
fan_speed: 1.0
max_power: 1.0
shutdown_speed: 1.0             # on a Klipper shutdown: keep blowing (heater is off then)
kick_start_time: 0.5
tachometer_pin: ^PA1            # Spider endstop header, internal pull-up
tachometer_ppr: 2

[gcode_macro CHAMBER_HEAT]
description: Set the chamber heater target (0 = off). Usage: CHAMBER_HEAT TARGET=60
gcode:
    {% set target = params.TARGET|default(0)|float %}
    {% if target > 65 %}
        {action_raise_error("CHAMBER_HEAT: TARGET %.0f is above the 65 C limit (camera/motors)" % target)}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}
    {% if target > 0 %}
        # give the fan 5 s to spin up before the first rpm check
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_GUARD DURATION=5
    {% endif %}

[delayed_gcode _CHAMBER_FAN_GUARD]
# Runs every 2 s while the heater has a target. No airflow = fins at ~230 C.
gcode:
    {% set target = printer["heater_generic chamber_heater"].target %}
    {% set rpm = printer["heater_fan chamber_heater_fan"].rpm %}
    {% if target > 0 %}
        {% if rpm is none or rpm < 1000 %}
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
            RESPOND TYPE=error MSG="Chamber heater OFF: heater fan rpm {rpm} < 1000"
            {% if printer.print_stats.state == "printing" %}
                PAUSE
            {% endif %}
        {% else %}
            UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_GUARD DURATION=2
        {% endif %}
    {% endif %}
