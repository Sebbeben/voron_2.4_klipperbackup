# =====================================================================
#  heatsoak.cfg - chamber heat soak for ABS/ASA
# =====================================================================
#  STATUS: NOT ACTIVE. Prepared 2026-11-13, not yet tested.
#
#  Why: PRINT_START waits for "temperature_sensor chamber", but that
#  sensor is the NTC on the SB2040 PCB. It reads ~9 C above room
#  temperature (board self-heating) and the slicer passes CHAMBER=5/20,
#  so the wait is always skipped: ABS prints start in a cold chamber.
#  A soaked chamber gives a stable gantry/frame (QGL and mesh stay
#  valid during the print) and less warping/cracking.
#
#  HEATSOAK TIME=<min> [CHAMBER=<C>]
#    TIME    - minimum soak time in minutes (default 15). TIME=0 skips it.
#    CHAMBER - optional: after TIME, also wait until the chamber_air
#              sensor reaches this value. Only used if that sensor
#              exists. Note: TEMPERATURE_WAIT has no timeout.
#
#  How to activate:
#    1. printer.cfg:   [include heatsoak.cfg]
#    2. PRINT_START:   replace the TEMPERATURE_WAIT line with the
#                      prepared HEATSOAK line (see comment there).
#    3. Slicer:        pass SOAK=<min> (and CHAMBER=<C> once a real
#                      chamber sensor is fitted) to PRINT_START.
#  Note: like any long macro, a cancel from Mainsail is only handled
#  after the soak ends. Use the emergency stop if you must abort.
# =====================================================================

# ---------------------------------------------------------------------
#  Optional real chamber sensor (hardware not fitted yet)
#  The spare HT-NTC100K (B3950, 2 m cable) on the free Spider T0 port.
#  Mount it mid-height on a side panel, out of the part fan airflow
#  and away from the bed.
# ---------------------------------------------------------------------
#[temperature_sensor chamber_air]
#sensor_type: Generic 3950
#sensor_pin: PC0                  # Spider T0 (unused - extruder runs on SB2040)
#min_temp: 0
#max_temp: 100
#gcode_id: C

[gcode_macro HEATSOAK]
description: Heat soak the chamber: TIME=<minutes> [CHAMBER=<C>]
variable_sensor: "temperature_sensor chamber_air"
gcode:
    {% set soak_time = params.TIME|default(15)|int %}
    {% set chamber = params.CHAMBER|default(0)|float %}
    {% set has_sensor = sensor in printer %}

    {% if soak_time > 0 %}
        RESPOND MSG="Heatsoak: {soak_time} min"
        {% for minute in range(soak_time) %}
            SET_DISPLAY_TEXT MSG="Heatsoak: {soak_time - minute} min left"
            G4 P60000
        {% endfor %}
    {% endif %}

    {% if chamber > 0 %}
        {% if has_sensor %}
            SET_DISPLAY_TEXT MSG="Heatsoak: chamber to {chamber}C"
            TEMPERATURE_WAIT SENSOR="{sensor}" MINIMUM={chamber}
        {% else %}
            RESPOND TYPE=echo MSG="Heatsoak: no chamber_air sensor, CHAMBER={chamber} ignored (time only)"
        {% endif %}
    {% endif %}
