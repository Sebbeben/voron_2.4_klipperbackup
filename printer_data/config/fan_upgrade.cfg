#####################################################################
#   Fan upgrade - HoneyBadger fans on Mellow FLY-SB2040 v1
#####################################################################
#
# STATUS: PREPARED, NOT ACTIVE. Everything below is commented out.
#
# Hardware (ordered 2026-11-13 from 3do.dk, order 42689):
#   - Hotend fan:       HoneyBadger 4010 axial 24V High SP (9400 RPM)
#   - Part cooling fan: HoneyBadger 5015 blower 9200 RPM, 4-wire PWM/tach, wide mouth
#
# SB2040 v1 pins (Mellow docs, https://mellow-3d.github.io/fly_sb2040_v1_pins.html):
#   gpio13 = Fan 0 power (PCF, part fan)    gpio17 = Fan 0 PWM (header A1 / pad PWM1)
#   gpio14 = Fan 1 power (HEF, hotend fan)  gpio16 = Fan 1 PWM (header A2 / pad PWM0)
#   gpio29 = LIMIT_1 endstop input (free)   -> used for hotend fan tach
#   gpio28 = LIMIT_0 (in use: Voron TAP)    gpio25 = LIMIT_2 (HV, shared with status LED - avoid)
#   NOTE: Mellow's PWM labels cross over (Fan 0 -> PWM1, Fan 1 -> PWM0). Verify with a
#         continuity test before wiring.
#
# Only one free input pin is confirmed (gpio29), so it goes to the HOTEND fan tach:
# that fan is the one that caused the clogs when it died. The part fan's white tach
# wire stays unconnected (insulate it) until a second free input is confirmed.
#
# HOW TO ACTIVATE:
#   1. Power the printer OFF before touching any wiring.
#   2. Wire the fans as described in each section below.
#   3. In printer.cfg: comment out the old [fan] and [heater_fan hotend_fan] sections.
#   4. In printer.cfg: uncomment "[include fan_upgrade.cfg]".
#   5. Uncomment the sections below that match your wiring.
#   6. FIRMWARE_RESTART, then test:
#        M106 S255 / M106 S128 / M107        -> part fan full / half / off
#        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=60   -> hotend fan on
#        Check RPM in Mainsail (the fan cards show RPM once a tach pin is configured).
#   7. If the part fan runs at full speed when it should be off (or the reverse),
#      invert the PWM pin: "pin: !SB2040:gpio17".


#####################################################################
#   Part cooling fan - HoneyBadger 5015 (4-wire)
#####################################################################
# Wiring (4-wire fan header for Fan 0):
#   Red   (+)    -> fan V+ (24V, check the 5V/24V jumper is set to 24V)
#   Black (-)    -> Fan 0 switched GND (gpio13, used as enable_pin below)
#   Blue  (PWM)  -> Fan 0 PWM (gpio17)
#   White (tach) -> not connected for now (insulate)

#[fan]
#pin: SB2040:gpio17              # Blue wire, PWM speed signal
#enable_pin: SB2040:gpio13       # Fan 0 power switch, turned on whenever speed > 0
#hardware_pwm: True
#cycle_time: 0.00004             # 25 kHz, standard for 4-wire PWM fans
#off_below: 0.10
#kick_start_time: 0.5
##tachometer_pin: ^SB2040:gpioX  # TODO: only if a second free input pin is found
##tachometer_ppr: 2

# Fallback if PWM control misbehaves: connect only red/black to the Fan 0 header,
# leave blue and white unconnected (the fan then runs at full speed when powered),
# and keep the original [fan] section in printer.cfg (pin: SB2040:gpio13).


#####################################################################
#   Hotend fan - HoneyBadger 4010 High SP
#####################################################################
# Wiring:
#   Red   (+)    -> Fan 1 header V+ (24V)
#   Black (-)    -> Fan 1 header switched GND (gpio14)
#   Tach wire    -> LIMIT_1 signal pin (gpio29), only if the fan has a 3rd (tach) wire

#[heater_fan hotend_fan]
#pin: SB2040:gpio14
#max_power: 1.0
#kick_start_time: 0.5
#heater: extruder
#heater_temp: 50.0
#tachometer_pin: ^SB2040:gpio29  # Remove this line (and the ppr line) if the fan is 2-wire
#tachometer_ppr: 2


