# =====================================================================
#  print_start_v2.cfg - new PRINT_START (replacement for the one in printer.cfg)
# =====================================================================
#  STATUS: NOT ACTIVE. Prepared 2026-11-13, not yet tested.
#
#  Changes compared to the PRINT_START in printer.cfg:
#   1. Real heat soak: SOAK=<min> from the slicer (Orca sends 20 for
#      ABS/ASA/PC/PA). Uses HEATSOAK from heatsoak.cfg if included,
#      otherwise a plain timed wait. The old version waited for the
#      SB2040 PCB sensor to reach CHAMBER=5/20 - always skipped.
#   2. Part fan at 100 % only during the soak (circulates chamber air),
#      off before probing, so TAP is not disturbed by fan vibration.
#   3. KAMP LINE_PURGE next to the printed objects instead of a fixed
#      20 mm prime line at Y4.
#   4. Removed the redundant move to the bed centre before SMART_PARK.
#   5. CLEAR_PAUSE at the start (a stale pause state can block a print).
#   6. All parameters have safe defaults, so a missing value from the
#      slicer does not crash the macro.
#
#  Parameters (all optional except BED and EXTRUDER):
#    BED=<C> EXTRUDER=<C> CHAMBER=<C> SOAK=<min> MATERIAL=<type>
#
#  How to activate:
#    1. printer.cfg: rename the old macro
#         [gcode_macro PRINT_START]  ->  [gcode_macro PRINT_START_OLD]
#    2. printer.cfg: un-comment  [include print_start_v2.cfg]
#       (optional: also [include heatsoak.cfg] for the countdown display
#        and chamber_air support)
#    3. KAMP_Settings.cfg: tip_distance is set to 1.5 (= PRINT_END retract)
#  Rollback: undo step 1 and comment the include again.
# =====================================================================

[gcode_macro PRINT_START]
description: Home, heat, soak, level, mesh, purge. BED= EXTRUDER= [CHAMBER=] [SOAK=] [MATERIAL=]
gcode:
    {% set target_bed = params.BED|default(0)|int %}
    {% set target_extruder = params.EXTRUDER|default(0)|int %}
    {% set target_chamber = params.CHAMBER|default(0)|float %}
    {% set soak_min = params.SOAK|default(0)|int %}
    {% set material = params.MATERIAL|default("unknown")|string|upper %}
    {% set probe_temp = 150 %}
    {% set x_center = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_center = printer.toolhead.axis_maximum.y|float / 2 %}

    {% if target_bed == 0 or target_extruder == 0 %}
        {action_raise_error("PRINT_START needs BED and EXTRUDER (got BED=%d EXTRUDER=%d)" % (target_bed, target_extruder))}
    {% endif %}

    RESPOND MSG="PRINT_START: {material} - bed {target_bed}C, nozzle {target_extruder}C, soak {soak_min} min"
    CLEAR_PAUSE
    BED_MESH_CLEAR

    # --- Home ---
    SET_DISPLAY_TEXT MSG="Homing"
    STATUS_HOMING
    G28
    G90

    # --- Heat the bed with the nozzle parked over the centre ---
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}C"
    STATUS_HEATING
    G1 X{x_center} Y{y_center} Z15 F9000
    {% if soak_min > 0 %}
        M106 S255                                  # Circulate chamber air while soaking
    {% endif %}
    M190 S{target_bed}

    # --- Heat soak ---
    {% if soak_min > 0 or target_chamber > 0 %}
        {% if 'gcode_macro HEATSOAK' in printer %}
            HEATSOAK TIME={soak_min} CHAMBER={target_chamber}
        {% else %}
            SET_DISPLAY_TEXT MSG="Heatsoak: {soak_min} min"
            G4 P{soak_min * 60000}
        {% endif %}
    {% else %}
        SET_DISPLAY_TEXT MSG="Bed settle: 5 min"
        G4 P300000                                 # Let the bed temperature settle (low-temp materials)
    {% endif %}
    M107                                           # Part fan off before probing

    # --- Level and mesh with a warm but non-oozing nozzle (TAP) ---
    SET_DISPLAY_TEXT MSG="Nozzle: {probe_temp}C"
    M109 S{probe_temp}
    SET_DISPLAY_TEXT MSG="Leveling"
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    G28 Z
    SET_DISPLAY_TEXT MSG="Bed mesh"
    STATUS_MESHING
    BED_MESH_CALIBRATE                             # Adaptive via KAMP

    # --- Final heat next to the print, then purge ---
    SET_DISPLAY_TEXT MSG="Nozzle: {target_extruder}C"
    STATUS_HEATING
    SMART_PARK
    M109 S{target_extruder}
    SET_DISPLAY_TEXT MSG="Purge"
    STATUS_PRINTING
    LINE_PURGE
    SET_DISPLAY_TEXT MSG="Printing"
