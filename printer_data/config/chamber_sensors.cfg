# =====================================================================
#  chamber_sensors.cfg - chamber air temperature (3 x NTC 100K)
# =====================================================================
#  STATUS: NOT ACTIVE. Prepared 2026-11-14, hardware not fitted yet.
#
#  Sensors: generic AliExpress "NTC 100K" thermistors (50 pcs on hand,
#  beta not specified - Generic 3950 is the usual value, verify below).
#  Free Spider thermistor inputs: T0 = PC0, T1 = PC1, T2 = PC2
#  (PC3 = bed, extruder thermistor is on the SB2040).
#
#  Phase 1 - find the best spot (all three fitted temporarily):
#    chamber_air   PC0  mid-height, rear panel centre   (main candidate)
#    chamber_side  PC1  mid-height, side panel centre
#    chamber_top   PC2  under the top panel (hottest point)
#  Each bead 10-20 mm out in free air, shielded from bed radiation and
#  part-fan / Nevermore airflow, never in a corner (gantry + Z belts).
#  Run a heatsoak, compare the curves with QGL drift between runs.
#
#  Phase 2 - keep the spot that settles together with the QGL as
#  "chamber_air" (heatsoak.cfg uses that name). chamber_top can stay as
#  an over-temperature reference if a chamber heater is ever added.
#
#  Before trusting the readings: put all sensors together in still air
#  next to a reference thermometer for 15 min (and ideally in warm water,
#  ~50 C, sealed in a bag). If they read consistently off, try
#  sensor_type "NTC 100K beta 3950" alternatives or a custom
#  [thermistor] with measured temperature/resistance pairs.
#  Pick matching sensors from the 50 - readings should agree within ~1 C.
#
#  How to activate:
#    1. printer.cfg: [include chamber_sensors.cfg]
#    2. heatsoak.cfg: remove its commented chamber_air block (defined here)
#    3. Optional: change PRINT_START's TEMPERATURE_WAIT to chamber_air
#       (print_start_v2.cfg already uses HEATSOAK, which picks it up)
# =====================================================================

[temperature_sensor chamber_air]
sensor_type: Generic 3950
sensor_pin: PC0                 # Spider T0
min_temp: 0
max_temp: 100
gcode_id: C

[temperature_sensor chamber_side]
sensor_type: Generic 3950
sensor_pin: PC1                 # Spider T1
min_temp: 0
max_temp: 100

[temperature_sensor chamber_top]
sensor_type: Generic 3950
sensor_pin: PC2                 # Spider T2
min_temp: 0
max_temp: 100
