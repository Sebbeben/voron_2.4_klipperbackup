# =====================================================================
#  homing_v2.cfg - fixed sensorless homing (replacement for homing.cfg)
# =====================================================================
#  STATUS: NOT ACTIVE. Prepared 2026-11-13, not yet tested.
#
#  Fixes compared to homing.cfg:
#   1. G28 X / G28 Y alone no longer leaves the printer in relative
#      mode (G91). The G90/G91 mode from before homing is restored.
#   2. SET_KINEMATIC_POSITION no longer marks ALL axes as homed.
#      Before: "G28 X" on a cold printer also flagged Y and Z as homed,
#      so the next move could crash into a frame.
#   3. The Z lift before XY homing is safe when Z is already homed:
#      it only lifts to Z5 if the nozzle is lower, instead of resetting
#      Z to 1 (which made the Z position wrong after "G28 X").
#
#  How to activate (printer.cfg):
#      #[include homing.cfg]
#      [include homing_v2.cfg]
#  Then test with the toolhead assembled, hand on the e-stop:
#      G28 X   -> X homes, check: printer.toolhead.homed_axes == "x"
#      G28 Y   -> Y homes
#      G28     -> full home incl. Z on the bed centre
#      G28 X while Z is homed -> Z position must stay correct
# =====================================================================

[gcode_macro _HOME_X]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.49 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Back off 15 mm from the X endstop side before homing (only X is flagged)
    SET_KINEMATIC_POSITION X=15 SET_HOMED=x
    G91
    G1 X-15 F1200
    M400

    G28 X

    # Move away from the endstop
    G91
    G1 X-15 F1200
    M400

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.49 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Back off 15 mm from the Y endstop side before homing (only Y is flagged)
    SET_KINEMATIC_POSITION Y=15 SET_HOMED=y
    G91
    G1 Y-15 F1200
    M400

    G28 Y

    # Move away from the endstop
    G91
    G1 Y-15 F1200
    M400

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set was_absolute = printer.gcode_move.absolute_coordinates %}
    {% set z_homed = 'z' in printer.toolhead.homed_axes %}
    {% set th = printer.toolhead %}

    # --- Lift the nozzle away from the bed before moving X/Y ---
    {% if not z_homed %}
        # Z position unknown: pretend Z=0 (only Z flagged) and lift 4 mm
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=z
        G91
        G1 Z4 F1200
        {% if not home_z %}
            # Z was never really homed - clear the temporary flag again
            SET_KINEMATIC_POSITION CLEAR_HOMED=z
        {% endif %}
    {% elif th.position.z < 5 %}
        # Z is homed and low: lift to Z5
        G90
        G1 Z5 F1200
    {% endif %}

    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}

    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}

    {% if home_z %}
        G90
        G1 X{th.axis_maximum.x / 2} Y{th.axis_maximum.y / 2} F15000
        G28 Z
        G1 Z10 F1500
    {% endif %}

    # Restore the positioning mode that was active before homing
    {% if was_absolute %}
        G90
    {% else %}
        G91
    {% endif %}

[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
