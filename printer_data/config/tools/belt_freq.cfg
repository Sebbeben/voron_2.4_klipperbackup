# Belt tension by sound - runs tools/belt_freq.py from G-code (Mainsail console / KlipperScreen).
# STATUS: NOT INCLUDED. Needs klippy/extras/gcode_shell_command.py (KIAUH extension), which is
# not installed yet. Install (user):
#   curl -fL -o ~/klipper/klippy/extras/gcode_shell_command.py \
#     https://raw.githubusercontent.com/dw-0/kiauh/master/kiauh/extensions/gcode_shell_cmd/assets/gcode_shell_command.py
#   echo 'klippy/extras/gcode_shell_command.py' >> ~/klipper/.git/info/exclude
# then add [include tools/belt_freq.cfg] to printer.cfg and restart Klipper.
#
# Usage: BELT_FREQ [SECONDS=8], then pluck the belt 3-6 times while it records.
# Target on a V2.4: ~110 Hz over a 150 mm span, A and B within 2 Hz.
# Measure with a cold printer: heater fans (hotend/controller) are never switched off.

[gcode_shell_command belt_freq]
# --keep-fans: the macro handles the fans (the script cannot send G-code while
# Klipper is busy running it).
command: python3 -u /home/voron/printer_data/config/tools/belt_freq.py --keep-fans
timeout: 60
verbose: True

[gcode_macro BELT_FREQ]
description: Belt tension by sound (camera mic). Pluck the belt while it records.
gcode:
    {% set secs = params.SECONDS|default(8)|int %}
    {% set part = printer.fan.speed %}
    {% set nev = printer["fan_generic nevermore"].speed %}
    {% if printer["heater_fan hotend_fan"].speed > 0 or printer["heater_fan controller_fan"].speed > 0 %}
        RESPOND MSG="Warning: hotend/controller fan is running (heaters warm) - result may be noisy"
    {% endif %}
    M107
    SET_FAN_SPEED FAN=nevermore SPEED=0
    G4 P3000
    RUN_SHELL_COMMAND CMD=belt_freq PARAMS="--seconds {secs}"
    M106 S{(part * 255)|round|int}
    SET_FAN_SPEED FAN=nevermore SPEED={nev}
