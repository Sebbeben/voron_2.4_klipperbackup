# CALIB_PLATE - one calibration plate for a new filament (flow tiles, PA lines, bridges,
# retraction, max volumetric flow, temperature tower last). Every test is one labelled piece.
# Writes calib_<MATERIAL>_<date>.gcode to the gcodes folder; start it like any print.
#   CALIB_PLATE MATERIAL=PETG            materials: ABS PLA PETG TPU NYLON POM
#   CALIB_PLATE MATERIAL=PETG RESET=1    the plate is empty (forget the recorded layout)
#   CALIB_PLATE MATERIAL=PETG TEMP=0     without the temperature tower
#   CALIB_PLATE MATERIAL=PETG BRIDGE=0   without the bridge test
#   CALIB_PLATE MATERIAL=PLA NOZZLE=205 BED=55 NAME=ECO   override the start values / label
#   CALIB_PLATE LIST=1                   show the materials and their start values
# Uses gcode_shell_command (installed for BELT_FREQ). Script: tools/calib_plate.py

[gcode_shell_command calib_plate]
command: python3 -u /home/voron/printer_data/config/tools/calib_plate.py
timeout: 120
verbose: True

[gcode_macro CALIB_PLATE]
description: Generate a labelled calibration plate for a filament (MATERIAL=PETG ...)
gcode:
    {% if params.LIST|default(0)|int %}
        RUN_SHELL_COMMAND CMD=calib_plate PARAMS="--list"
    {% else %}
        {% set mat = params.MATERIAL|default("")|upper %}
        {% if not mat %}
            { action_raise_error("CALIB_PLATE: give MATERIAL=ABS/PLA/PETG/TPU/NYLON/POM (LIST=1 shows them)") }
        {% endif %}
        {% set args = mat %}
        {% if params.RESET|default(0)|int %}{% set args = args ~ " --reset" %}{% endif %}
        {% if not params.TEMP|default(1)|int %}{% set args = args ~ " --no-temp" %}{% endif %}
        {% if not params.BRIDGE|default(1)|int %}{% set args = args ~ " --no-bridge" %}{% endif %}
        {% if params.NOZZLE %}{% set args = args ~ " --temp " ~ params.NOZZLE|int %}{% endif %}
        {% if params.BED %}{% set args = args ~ " --bed " ~ params.BED|int %}{% endif %}
        {% if params.NAME %}{% set args = args ~ " --name " ~ params.NAME|replace(" ", "")|upper %}{% endif %}
        RUN_SHELL_COMMAND CMD=calib_plate PARAMS="{args}"
    {% endif %}
